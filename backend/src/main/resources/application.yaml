spring:
  application:
    name: simple-library

  profiles.active: local

  jpa:
    hibernate.ddl-auto: update
    # Dialect is detected from the JDBC connection (H2 or PostgreSQL), so it is not set here.
    # Responses are DTOs, so no lazy loading happens while rendering JSON.
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # Must equal the "iss" claim in tokens, i.e. the URL browsers use to reach Keycloak.
          # Override jwk-set-uri when the app runs in Docker (see docker-compose.yaml).
          issuer-uri: ${app.keycloak.public-url}/realms/${app.keycloak.realm}
          jwk-set-uri: ${app.keycloak.public-url}/realms/${app.keycloak.realm}/protocol/openid-connect/certs

app:
  keycloak:
    public-url: http://localhost:8080
    realm: library
    # Admin REST API, used to create users on self-registration (service account "library-backend").
    admin:
      # URL of Keycloak as seen from the backend. In Docker this is the container URL, not localhost.
      base-url: ${app.keycloak.public-url}
      realm: ${app.keycloak.realm}
      client-id: library-backend
      # No default on purpose. Set KEYCLOAK_ADMIN_CLIENT_SECRET (Keycloak -> Clients -> library-backend -> Credentials).
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
  cors:
    # Origins of the React front end (comma-separated). Override with APP_CORS_ALLOWED_ORIGINS.
    allowed-origins: http://localhost:3000,http://localhost:5173

springdoc:
  swagger-ui:
    oauth:
      client-id: library-swagger
      use-pkce-with-authorization-code-grant: true
      scopes: openid
