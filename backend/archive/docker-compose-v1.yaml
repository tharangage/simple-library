version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: super_admin        # Root/Superuser for the cluster
      POSTGRES_PASSWORD: admin_password_999
      POSTGRES_DB: management_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mount the shell script instead of a SQL file
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: simple-library-app
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/simple-library
      SPRING_DATASOURCE_USERNAME: simple-library
      SPRING_DATASOURCE_PASSWORD: simple-library
    ports:
      - "8080:8080"

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
    ports:
      - "8090:8090"
    depends_on:
      - postgres
    command: start-dev

volumes:
  pgdata:
