# GitHub CodeQL: deep semantic security + quality analysis. Free for public repositories.
# Results appear under Security -> Code scanning and as annotations on pull requests.
# Two languages: the Spring Boot backend (Java) and the React web app (JavaScript, frontend/).
name: CodeQL

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '23 3 * * 1'   # weekly, catches newly published queries
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Java
            language: java-kotlin
            build-mode: manual
          - name: JavaScript
            language: javascript-typescript
            build-mode: none     # JavaScript is analysed from source, no build needed
    steps:
      - uses: actions/checkout@v7

      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Compile
        if: matrix.language == 'java-kotlin'
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw -B -ntp -DskipTests compile

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
