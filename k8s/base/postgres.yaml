# One shared PostgreSQL for Keycloak (database "keycloak") and the library API (database "simple_library").
# The init script runs only on the first start, when the data volume is empty. Same content as
# keycloak/initdb/01-simple-library.sh used by the Docker Compose setup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
data:
  01-simple-library.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<SQL
    CREATE ROLE simple_library LOGIN PASSWORD '${SIMPLE_LIBRARY_DB_PASSWORD}';
    CREATE DATABASE simple_library OWNER simple_library;
    REVOKE CONNECT ON DATABASE simple_library FROM PUBLIC;
    REVOKE CONNECT ON DATABASE keycloak FROM PUBLIC;
    GRANT CONNECT ON DATABASE keycloak TO keycloak;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: keycloak
            - name: POSTGRES_USER
              value: keycloak
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-secrets
                  key: POSTGRES_PASSWORD
            - name: SIMPLE_LIBRARY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-secrets
                  key: SIMPLE_LIBRARY_DB_PASSWORD
            # A subfolder, because a mounted volume root contains lost+found on some storage classes.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak", "-d", "keycloak"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak", "-d", "keycloak"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
