# Spring Boot API (image <DOCKERHUB_USER>/simple-library-api). The public Keycloak URL and the CORS origin
# depend on the environment and are set by the overlay.
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -U keycloak; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: api
          image: ${DOCKERHUB_USER}/simple-library-api:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/simple_library
            - name: SPRING_DATASOURCE_USERNAME
              value: simple_library
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-secrets
                  key: SIMPLE_LIBRARY_DB_PASSWORD
            # The signing keys are fetched from inside the cluster; "localhost" or the public URL
            # would point at the pod itself (the 401 you saw with Docker Compose).
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: http://keycloak:8080/realms/library/protocol/openid-connect/certs
            - name: APP_KEYCLOAK_ADMIN_BASE_URL
              value: http://keycloak:8080
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: library-secrets
                  key: KEYCLOAK_ADMIN_CLIENT_SECRET
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: framework
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=70
          # No actuator in the project yet, so the probes check the port.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
