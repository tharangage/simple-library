# Two cert-manager issuers for Let's Encrypt, both solving the http challenge through Traefik.
#   letsencrypt-staging  certificates are NOT trusted by browsers; use it to test without rate limits.
#   letsencrypt-prod     the real certificates. Failed attempts count against Let's Encrypt rate limits.
# ${LETSENCRYPT_EMAIL} is filled in by k8s/cloud/setup.sh (Let's Encrypt writes here before a certificate expires).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ${LETSENCRYPT_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${LETSENCRYPT_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
