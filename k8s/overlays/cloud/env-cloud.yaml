# Environment-specific settings merged into the base Deployments (env entries are merged by name).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  template:
    spec:
      containers:
        - name: keycloak
          # Production mode instead of start-dev. TLS ends at Traefik (KC_HTTP_ENABLED and
          # KC_PROXY_HEADERS come from the base); Keycloak builds its optimized config on first start.
          args: ["start", "--import-realm"]
          env:
            # Public URL: what the browser uses and what ends up in the token "iss" claim.
            - name: KC_HOSTNAME
              value: https://${AUTH_HOST}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            # Must equal the "iss" claim of the tokens.
            - name: APP_KEYCLOAK_PUBLIC_URL
              value: https://${AUTH_HOST}
            - name: APP_CORS_ALLOWED_ORIGINS
              value: https://${WEB_HOST}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - name: API_BASE_URL
              value: https://${API_HOST}
            - name: KEYCLOAK_URL
              value: https://${AUTH_HOST}
