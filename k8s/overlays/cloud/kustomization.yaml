apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Public cloud cluster (OKE, GKE, ...): real host names, https with Let's Encrypt certificates.
# The ${...} values (host names, issuer) are filled in by k8s/cloud/deploy.sh (envsubst).
namespace: simple-library
resources:
  - ../../base
  - ingress.yaml
patches:
  - path: env-cloud.yaml
  # The cloud's block volumes have a minimum size (about 50 GB on OCI); ask for it explicitly.
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 50Gi
# secrets.env and realm-library.json are generated by k8s/cloud/deploy.sh and are not committed.
secretGenerator:
  - name: library-secrets
    envs:
      - secrets.env
configMapGenerator:
  - name: keycloak-realm
    files:
      - realm-library.json
