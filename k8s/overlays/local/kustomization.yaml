apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Local kind cluster: hosts under localhost (resolves to 127.0.0.1), plain http.
namespace: simple-library
resources:
  - ../../base
  - ingress.yaml
patches:
  - path: env-local.yaml
# secrets.env and realm-library.json are generated by k8s/kind/deploy.sh and are not committed.
secretGenerator:
  - name: library-secrets
    envs:
      - secrets.env
configMapGenerator:
  - name: keycloak-realm
    files:
      - realm-library.json
