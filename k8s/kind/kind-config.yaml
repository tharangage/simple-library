# Local cluster for Simple Library. The port mappings must exist when the cluster is created
# (kind cannot add them later). They let your browser reach the ingress controller on
# http://*.localhost (port 80) and https (port 443).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: simple-library
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
