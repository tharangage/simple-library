# Helm values for Traefik on kind. Traefik listens on the node's ports 80 and 443 (hostPort),
# which kind-config.yaml maps to your machine. ingress-nginx was retired in March 2026,
# so Traefik is the ingress controller. The Ingress resources stay standard Kubernetes ones.
ports:
  web:
    hostPort: 80
  websecure:
    hostPort: 443
nodeSelector:
  ingress-ready: "true"
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
