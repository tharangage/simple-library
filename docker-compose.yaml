# Runs only the Spring Boot app. Keycloak and PostgreSQL are already running in WSL
# (compose project "keycloak", network "keycloak_default"), so the app joins that network.
#
# Start:  docker compose up -d --build
# Swagger UI: http://localhost:8081/swagger-ui/index.html
services:
  app:
    build: ./backend
    image: simple-library:latest
    container_name: simple-library-app
    environment:
      # h2 (default, no DB needed) or prod (PostgreSQL, see SPRING_DATASOURCE_* below)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      # Used only when SPRING_PROFILES_ACTIVE=prod. Create the DB first, e.g.:
      #   docker exec -i keycloak-postgres-1 psql -U keycloak -d postgres < keycloak/migrate-simple-library.sql
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/simple_library
      SPRING_DATASOURCE_USERNAME: simple_library
      SPRING_DATASOURCE_PASSWORD: ${SIMPLE_LIBRARY_DB_PASSWORD:-simple_library}

      # Inside the container "localhost" is the app itself, so fetch the signing keys from the
      # Keycloak container. The issuer-uri (token "iss" claim) stays http://localhost:8080/...
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/library/protocol/openid-connect/certs

      # Self-registration (E02): create users through the Keycloak Admin API as client "library-backend".
      # Inside the container Keycloak is reachable as "keycloak", not localhost. Set the secret in your shell or .env
      # (Keycloak -> Clients -> library-backend -> Credentials). There is no default.
      APP_KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}

    ports:
      # 8080 on the host is taken by Keycloak
      - "8081:8080"
    networks:
      - keycloak_default

  webapp:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - app

networks:
  keycloak_default:
    external: true
